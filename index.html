<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS // Unblocked Portal</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --panel: #121216;
            --primary: #00ffcc;
            --secondary: #9437ff;
            --text: #ffffff;
            --text-muted: #8a8a93;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow-x: hidden;
        }
        header {
            background: linear-gradient(180deg, rgba(18,18,22,0.8) 0%, rgba(10,10,12,0) 100%);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f1f2e;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0,255,204,0.2);
        }
        .search-container {
            max-width: 800px;
            margin: 60px auto 40px auto;
            text-align: center;
            padding: 0 20px;
        }
        .search-container h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .search-container p {
            color: var(--text-muted);
            margin-bottom: 25px;
        }
        .search-box {
            display: flex;
            background: var(--panel);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid #2a2a3a;
            box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
        .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0,255,204,0.15);
        }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 20px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .search-box button {
            background: linear-gradient(135deg, var(--primary), #00cca3);
            border: none;
            color: #000;
            font-weight: bold;
            padding: 0 30px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .search-box button:hover {
            transform: scale(1.02);
        }
        .main-content {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px 60px 20px;
        }
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 1px solid #1f1f2e;
            padding-bottom: 15px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 8px;
        }
        .tab-btn.active, .tab-btn:hover {
            color: var(--primary);
            background: rgba(0,255,204,0.05);
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }
        .game-card {
            background: var(--panel);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #1f1f2e;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            position: relative;
        }
        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--secondary);
            box-shadow: 0 10px 30px rgba(148,55,255,0.15);
        }
        .game-thumbnail {
            height: 140px;
            background: linear-gradient(135deg, #1e1e24 0%, #15151a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            position: relative;
            border-bottom: 1px solid #1f1f2e;
        }
        .game-card:hover .game-thumbnail {
            background: linear-gradient(135deg, #252530 0%, #1a1a24 100%);
        }
        .game-info {
            padding: 15px;
        }
        .game-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .game-tag {
            display: inline-block;
            font-size: 0.75rem;
            background: rgba(255,255,255,0.05);
            padding: 2px 8px;
            border-radius: 4px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">NEXUS // ARCADE</div>
        <div style="color: var(--primary); font-size: 0.9rem; font-weight:600;">[ PROXY ACTIVE ]</div>
    </header>

    <div class="search-container">
        <h2>Surf Without Limits</h2>
        <p>Bypass school firewalls and network restrictions instantly.</p>
        <div class="search-box">
            <input type="text" id="urlInput" placeholder="Enter website link or search terms..." />
            <button onclick="goToSite()">LAUNCH</button>
        </div>
    </div>

    <div class="main-content">
        <div class="tabs">
            <button class="tab-btn active" onclick="filterGames('all')">All Games</button>
            <button class="tab-btn" onclick="filterGames('action')">Action</button>
            <button class="tab-btn" onclick="filterGames('sports')">Sports</button>
            <button class="tab-btn" onclick="filterGames('retro')">Retro</button>
        </div>

        <div class="game-grid" id="gameGrid"></div>
    </div>

    <script>
        function goToSite() {
            let url = document.getElementById('urlInput').value.trim();
            if (!url) return alert('Enter a URL or game link first!');
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            window.location.href = '/proxy/' + url;
        }

        function launchGame(targetUrl) {
            window.location.href = '/proxy/' + targetUrl;
        }

        const genres = ['action', 'sports', 'retro', 'puzzle'];
        const emojis = { action: '⚔️', sports: '⚽', retro: '🕹️', puzzle: '🧩' };
        const adjectives = ['Cyber', 'Neon', 'Retro', 'Shadow', 'Super', 'Hyper', 'Turbo', 'Pixel', 'Alpha', 'Cosmic'];
        const nouns = ['Run', 'Striker', 'Quest', 'Blaster', 'Racer', 'Drive', 'Breaker', 'Combat', 'Arena', 'Force'];

        const gameGrid = document.getElementById('gameGrid');

        for (let i = 1; i <= 100; i++) {
            const randomGenre = genres[Math.floor(Math.random() * genres.length)];
            const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
            const noun = nouns[Math.floor(Math.random() * nouns.length)];
            const title = adj + ' ' + noun + ' ' + (i * 7 % 9 + 1);
            
            const mockUrl = 'https://crazygames.com' + title.toLowerCase().replace(/ /g, '-');

            const card = document.createElement('div');
            card.className = 'game-card';
            card.setAttribute('data-category', randomGenre);
            card.onclick = () => launchGame(mockUrl);

            card.innerHTML = `
                <div class="game-thumbnail">${emojis[randomGenre]}</div>
                <div class="game-info">
                    <div class="game-title">${title}</div>
                    <span class="game-tag">${randomGenre}</span>
                </div>
            `;
            gameGrid.appendChild(card);
        }

        function filterGames(category) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.game-card').forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') goToSite();
        });
    </script>
</body>
</html>
